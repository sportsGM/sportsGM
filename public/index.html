<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>龍女體育 AI 即時賽事分析中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#060914;color:#e5e7eb}.glass{background:rgba(15,23,42,.84);border:1px solid rgba(148,163,184,.16);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.gold{background:linear-gradient(90deg,#fbbf24,#34d399);-webkit-background-clip:text;color:transparent}.active{background:linear-gradient(90deg,#f59e0b,#10b981)!important;color:#06101a!important;border-color:transparent!important}
.scan{animation:scan 1.1s infinite}@keyframes scan{0%,100%{opacity:.35}50%{opacity:1}}.modal-open{overflow:hidden}
</style></head>
<body>
<header class="sticky top-0 z-30 bg-[#070a13]/95 backdrop-blur border-b border-slate-800">
<div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
<div><h1 class="text-xl md:text-2xl font-black gold tracking-wider">龍女體育 AI 即時賽事分析中心</h1><p class="text-xs text-slate-500 mt-1">匿名可看基本分析；會員登入後可看推薦人、留言區與互動統計。</p></div>
<div id="authBox" class="text-xs"></div>
</div></header>
<main class="max-w-7xl mx-auto p-4 space-y-4">
<section class="glass rounded-3xl p-4"><p class="text-sm text-slate-400 mb-2 font-bold">球類</p><div class="flex flex-wrap gap-2 mb-4" id="sports"></div><p class="text-sm text-slate-400 mb-2 font-bold">聯盟</p><div class="flex flex-wrap gap-2" id="leagues"></div></section>
<section class="glass rounded-3xl p-4"><div class="flex justify-between items-center mb-4"><h2 id="title" class="text-lg font-black">今日賽事</h2><button id="reload" class="rounded-xl bg-slate-800 px-3 py-2 text-xs font-black">重新讀取</button></div><div id="games" class="grid gap-3"></div></section>
</main>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm p-3 md:p-6"><div class="mx-auto max-w-5xl max-h-[92vh] overflow-y-auto glass rounded-3xl"><div class="sticky top-0 bg-[#0b1220]/95 backdrop-blur border-b border-slate-800 p-4 flex items-start justify-between gap-3"><div><div id="modalLeague" class="text-xs text-slate-500 font-black"></div><h3 id="modalTitle" class="text-xl md:text-2xl font-black"></h3></div><button onclick="closeModal()" class="rounded-xl bg-slate-800 px-3 py-2 text-sm font-black">關閉</button></div><div id="modalBody" class="p-4 space-y-4"></div></div></div>

<script>
const data={baseball:[["MLB","MLB"],["NPB","日本職棒"],["CPBL","中華職棒"],["KBO","韓國職棒"]],basketball:[["NBA","NBA"],["WNBA","WNBA"],["CBA","中國職籃"],["BLeague","日本職籃"]],other:[["SOCCER","足球"],["NHL","NHL冰球"],["HORSE","賽馬"]]};
let state={sport:"baseball",league:"MLB",games:[],current:null,session:JSON.parse(localStorage.getItem("session")||"null"),profile:JSON.parse(localStorage.getItem("profile")||"null")};
const $=id=>document.getElementById(id); const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); const bar=v=>`<div class="h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400" style="width:${Math.max(0,Math.min(100,+v||0))}%"></div></div>`;
function token(){return state.session?.access_token||""}
function headers(){return token()?{"authorization":"Bearer "+token(),"content-type":"application/json"}:{"content-type":"application/json"}}
function gameKey(g){return `${state.league}|${g.awayTeam}|${g.homeTeam}|${g.time}`}
function renderAuth(){ $("authBox").innerHTML=state.session?`<div class="flex items-center gap-2"><span class="text-emerald-300 font-bold">會員：${esc(state.profile?.nickname||state.session.user?.email||"已登入")}</span><button onclick="logout()" class="rounded-lg bg-slate-800 px-3 py-2 font-black">登出</button></div>`:`<div class="flex gap-2"><input id="email" placeholder="Email" class="w-36 rounded-lg bg-slate-950 border border-slate-700 px-2 py-2"><input id="password" type="password" placeholder="密碼" class="w-28 rounded-lg bg-slate-950 border border-slate-700 px-2 py-2"><button onclick="login()" class="rounded-lg bg-amber-400 text-slate-950 px-3 py-2 font-black">會員登入</button></div>`;}
async function login(){const r=await fetch("/api/auth",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",email:$("email").value,password:$("password").value})});const d=await r.json();if(!d.ok)return alert(d.error||"登入失敗");state.session=d.session;state.profile=d.profile;localStorage.setItem("session",JSON.stringify(d.session));localStorage.setItem("profile",JSON.stringify(d.profile));renderAuth(); if(state.current) renderMemberSections();}
function logout(){localStorage.removeItem("session");localStorage.removeItem("profile");state.session=null;state.profile=null;renderAuth(); if(state.current) renderMemberSections();}
function renderSports(){$("sports").innerHTML=[["baseball","棒球"],["basketball","籃球"],["other","其他"]].map(x=>`<button class="sport ${state.sport==x[0]?"active":"bg-slate-900"} rounded-2xl border border-slate-700 px-5 py-3 font-black" data-s="${x[0]}">${x[1]}</button>`).join("");document.querySelectorAll(".sport").forEach(b=>b.onclick=()=>{state.sport=b.dataset.s;state.league=data[state.sport][0][0];renderSports();renderLeagues();loadGames();});}
function renderLeagues(){$("leagues").innerHTML=data[state.sport].map(x=>`<button class="league ${state.league==x[0]?"active":"bg-slate-900"} rounded-2xl border border-slate-700 px-4 py-2 font-black text-sm" data-l="${x[0]}">${x[1]}</button>`).join("");document.querySelectorAll(".league").forEach(b=>b.onclick=()=>{state.league=b.dataset.l;renderLeagues();loadGames();});}
async function loadGames(){$("games").innerHTML='<div class="rounded-2xl bg-slate-950 border border-slate-800 p-5 text-slate-400">讀取今日賽事與台彩盤中...</div>';const r=await fetch(`/api/games?league=${state.league}&t=${Date.now()}`);const d=await r.json();state.games=d.games||[];$("title").textContent=`${d.leagueName||state.league}｜今日賽事`;renderGames();}
function taiGrid(g){const t=g.taicai||{};return `<div class="mt-3 rounded-2xl bg-slate-900/70 border border-slate-800 p-3"><div class="text-xs text-amber-300 font-black mb-2">台彩盤</div><div class="grid md:grid-cols-3 gap-2 text-xs"><div class="rounded-xl bg-blue-400/10 border border-blue-400/20 p-2"><b>讓分</b><br>${esc(t.awayHandicap||"--")}<br>${esc(t.homeHandicap||"--")}</div><div class="rounded-xl bg-emerald-400/10 border border-emerald-400/20 p-2"><b>不讓分</b><br>${esc(t.awayMoneyline||"--")}<br>${esc(t.homeMoneyline||"--")}</div><div class="rounded-xl bg-pink-400/10 border border-pink-400/20 p-2"><b>大小分</b><br>${esc(t.over||"--")}<br>${esc(t.under||"--")}</div></div></div>`}
function renderGames(){if(!state.games.length){$("games").innerHTML='<div class="rounded-2xl bg-slate-950 border border-slate-800 p-5 text-slate-400">目前沒有賽事。</div>';return;}$("games").innerHTML=state.games.map((g,i)=>`<article class="rounded-3xl bg-slate-950/80 border border-slate-800 p-4"><div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3"><div class="flex-1"><div class="text-xs text-slate-500 font-bold">${esc(g.time)}</div><h3 class="text-xl font-black mt-1">${esc(g.matchup)}</h3>${taiGrid(g)}</div><button onclick="analyzeGame(${i})" class="rounded-2xl bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 font-black px-5 py-3">開始分析</button></div></article>`).join("");}
window.closeModal=()=>{$("modal").classList.add("hidden");document.body.classList.remove("modal-open")};
function openModal(g){$("modal").classList.remove("hidden");document.body.classList.add("modal-open");$("modalTitle").textContent=g.matchup;$("modalLeague").textContent=state.league;$("modalBody").innerHTML=`<div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="font-black text-slate-100 mb-3">${esc(g.matchup)}</div><div class="space-y-2 text-emerald-300 font-bold"><div class="scan">正在讀取台彩盤...</div><div class="scan">正在比對雙方近況與歷年戰績...</div><div class="scan">正在評估讓分過盤與大小分...</div><div class="scan">正在產生 AI 推薦...</div></div></div>`}
window.analyzeGame=async i=>{const g=state.games[i];state.current=g;openModal(g);const t=g.taicai||{};const q=new URLSearchParams({league:state.league,gameId:g.id,time:g.time||"",away:g.awayTeam||"",home:g.homeTeam||"",awayHandicap:t.awayHandicap||"",homeHandicap:t.homeHandicap||"",awayMoneyline:t.awayMoneyline||"",homeMoneyline:t.homeMoneyline||"",over:t.over||"",under:t.under||""});const r=await fetch(`/api/analyze?${q}&t=${Date.now()}`);const d=await r.json();renderAnalysis(d);}
function renderAnalysis(d){const a=d.analysis||{},g=d.game||state.current;$("modalBody").innerHTML=`<div class="space-y-4">${taiGrid(g)}<div class="grid md:grid-cols-2 gap-3"><div class="rounded-2xl bg-emerald-400/10 border border-emerald-400/20 p-4"><div class="text-xs text-emerald-300 font-black">核心推薦</div><div class="text-2xl font-black text-emerald-300 mt-1">${esc(a.pickTeam)}</div>${bar(a.confidence)}<div class="text-xs text-slate-400 mt-1">整體信心 ${a.confidence||0}%</div></div><div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="text-xs text-slate-500 font-black">預測比分</div><div class="font-black text-amber-300 mt-1">${esc(a.predictedScore)}</div></div></div><div class="grid md:grid-cols-3 gap-3"><div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="text-xs text-slate-500 font-black">獨贏方向</div><div class="font-black text-amber-300 mt-1">${esc(a.pickTeam)}</div>${bar(a.winRate)}<div class="text-xs text-slate-400 mt-1">獨贏率 ${a.winRate||0}%</div></div><div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="text-xs text-slate-500 font-black">讓分判斷</div><div class="font-black text-blue-300 mt-1">${esc(a.spreadPick)}</div>${bar(a.coverRate)}<div class="text-xs text-slate-400 mt-1">過盤率 ${a.coverRate||0}%</div></div><div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="text-xs text-slate-500 font-black">大小分判斷</div><div class="font-black text-pink-300 mt-1">${esc(a.totalPick)}</div>${bar(a.totalRate)}<div class="text-xs text-slate-400 mt-1">大 ${a.overRate||0}% / 小 ${a.underRate||0}%</div></div></div><div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="text-xs text-slate-500 font-black mb-2">AI 總結</div><ul class="list-disc pl-5 space-y-2 text-slate-300">${(a.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div><div id="memberSection"></div></div>`;renderMemberSections();}
async function renderMemberSections(){const g=state.current;if(!g)return;const key=gameKey(g);if(!state.session){$("memberSection").innerHTML=`<div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="font-black text-amber-300">🔒 會員專區</div><p class="text-slate-400 mt-2">登入後可查看平台推薦人、留言區內容、今天轟啦 / 我下對面真實統計。</p></div>`;return;}let html='<div class="space-y-4">';html+=`<div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="font-black text-slate-200 mb-3">互動統計</div><div id="reactBox">讀取中...</div></div>`;html+=`<div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="font-black text-slate-200 mb-3">平台推薦人</div><div id="punditBox">讀取中...</div></div>`;html+=`<div class="rounded-2xl bg-slate-950 border border-slate-800 p-4"><div class="font-black text-slate-200 mb-3">會員留言區</div><textarea id="commentText" class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3" rows="3" placeholder="輸入你的盤口建議..."></textarea><button onclick="sendComment()" class="mt-2 rounded-xl bg-emerald-400 text-slate-950 font-black px-4 py-2">送出留言</button><div id="commentBox" class="mt-3">讀取中...</div></div>`;html+='</div>';$("memberSection").innerHTML=html;await loadReactions();await loadPundits();await loadComments();}
async function loadReactions(){const key=gameKey(state.current);const r=await fetch(`/api/reactions?game_key=${encodeURIComponent(key)}`);const d=await r.json();const c=d.counts||{boom:0,opposite:0};$("reactBox").innerHTML=`<div class="flex flex-wrap gap-2"><button onclick="react('boom')" class="rounded-xl bg-emerald-400 text-slate-950 font-black px-4 py-2">今天轟啦 ${c.boom}</button><button onclick="react('opposite')" class="rounded-xl bg-pink-400 text-slate-950 font-black px-4 py-2">我下對面 ${c.opposite}</button></div>`}
async function react(type){const key=gameKey(state.current);const r=await fetch('/api/reactions',{method:'POST',headers:headers(),body:JSON.stringify({game_key:key,reaction_type:type})});const d=await r.json();if(!d.ok)return alert(d.error||'操作失敗');loadReactions();}
async function loadPundits(){const key=gameKey(state.current);const r=await fetch(`/api/pundits?game_key=${encodeURIComponent(key)}`,{headers:headers()});const d=await r.json();if(!d.ok){$("punditBox").innerHTML='尚無權限或尚無推薦。';return;}$("punditBox").innerHTML=(d.picks||[]).length?(d.picks||[]).map(x=>`<div class="rounded-xl bg-slate-900 border border-slate-800 p-3 mb-2"><div class="font-black text-amber-300">${esc(x.pundits?.avatar||'🎯')} ${esc(x.pundits?.nickname||'推薦人')} <span class="text-xs text-emerald-300">近30場 ${x.pundits?.accuracy_30||0}%</span></div><div class="text-blue-300 font-bold">${esc(x.market)}：${esc(x.pick)} ${esc(x.line)}</div><div class="text-slate-400 text-sm mt-1">${esc(x.reason)}</div></div>`).join(''):'目前這場尚無推薦人內容。';}
async function loadComments(){const key=gameKey(state.current);const r=await fetch(`/api/comments?game_key=${encodeURIComponent(key)}`,{headers:headers()});const d=await r.json();if(!d.ok){$("commentBox").innerHTML='尚無權限或尚無留言。';return;}$("commentBox").innerHTML=(d.comments||[]).length?(d.comments||[]).map(c=>`<div class="rounded-xl bg-slate-900 border border-slate-800 p-3 mb-2"><div class="font-black text-emerald-300">${esc(c.nickname)}</div><div class="text-slate-300">${esc(c.content)}</div><div class="text-xs text-slate-500 mt-1">${new Date(c.created_at).toLocaleString('zh-TW')}</div></div>`).join(''):'目前還沒有留言。';}
async function sendComment(){const key=gameKey(state.current);const content=$("commentText").value.trim();if(!content)return alert('請輸入內容');const r=await fetch('/api/comments',{method:'POST',headers:headers(),body:JSON.stringify({game_key:key,content})});const d=await r.json();if(!d.ok)return alert(d.error||'送出失敗');$("commentText").value='';loadComments();}
$("reload").onclick=loadGames;renderAuth();renderSports();renderLeagues();loadGames();
</script></body></html>
