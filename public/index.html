<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>龍女體育 AI 即時賽事分析中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#060914;color:#e5e7eb}
.glass{background:rgba(15,23,42,.84);border:1px solid rgba(148,163,184,.16);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.gold{background:linear-gradient(90deg,#fbbf24,#34d399);-webkit-background-clip:text;color:transparent}
.active{background:linear-gradient(90deg,#f59e0b,#10b981)!important;color:#06101a!important;border-color:transparent!important}
.scan{animation:scan 1.1s infinite}
@keyframes scan{0%,100%{opacity:.35;transform:translateX(-4px)}50%{opacity:1;transform:translateX(4px)}}
</style>
</head>
<body>
<header class="sticky top-0 z-30 bg-[#070a13]/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
    <div>
      <h1 class="text-xl md:text-2xl font-black gold tracking-wider">龍女體育 AI 即時賽事分析中心</h1>
      <p class="text-xs text-slate-500 mt-1">選球類與聯盟，點開賽事後，AI 會依盤口、近況、歷年戰績與市場方向產生分析。</p>
    </div>
    <div id="last" class="text-xs text-emerald-300 font-bold">準備讀取今日賽事</div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 space-y-4">
  <section class="glass rounded-3xl p-4">
    <p class="text-sm text-slate-400 mb-2 font-bold">球類</p>
    <div class="flex flex-wrap gap-2 mb-4" id="sports"></div>
    <p class="text-sm text-slate-400 mb-2 font-bold">聯盟</p>
    <div class="flex flex-wrap gap-2" id="leagues"></div>
  </section>

  <section class="grid lg:grid-cols-[1fr_430px] gap-4">
    <div class="glass rounded-3xl p-4">
      <div class="flex justify-between items-center mb-4">
        <h2 id="title" class="text-lg font-black">今日賽事</h2>
        <button id="reload" class="rounded-xl bg-slate-800 px-3 py-2 text-xs font-black">重新讀取</button>
      </div>
      <div id="games" class="grid gap-3"></div>
    </div>

    <aside class="glass rounded-3xl p-4 h-fit lg:sticky lg:top-24">
      <h3 class="font-black text-amber-300 mb-3">AI 分析結果</h3>
      <div id="box" class="text-sm text-slate-400 leading-7">請先選一場賽事，點「開始分析」。</div>
    </aside>
  </section>
</main>

<script>
const data={
  baseball:[["MLB","MLB"],["NPB","日本職棒"],["CPBL","中華職棒"],["KBO","韓國職棒"]],
  basketball:[["NBA","NBA"],["WNBA","WNBA"],["CBA","中國職籃"],["BLeague","日本職籃"]],
  other:[["SOCCER","足球"],["NHL","NHL冰球"],["HORSE","賽馬"]]
};

let state={sport:"baseball",league:"MLB",games:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const bar=v=>`<div class="h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400" style="width:${Math.max(0,Math.min(100,+v||0))}%"></div></div>`;

function renderSports(){
 $("sports").innerHTML=[["baseball","棒球"],["basketball","籃球"],["other","其他"]].map(x=>`<button class="sport ${state.sport==x[0]?"active":"bg-slate-900"} rounded-2xl border border-slate-700 px-5 py-3 font-black" data-s="${x[0]}">${x[1]}</button>`).join("");
 document.querySelectorAll(".sport").forEach(b=>b.onclick=()=>{
  state.sport=b.dataset.s;
  state.league=data[state.sport][0][0];
  renderSports(); renderLeagues(); loadGames();
  $("box").innerHTML="請先選一場賽事，點「開始分析」。";
 });
}

function renderLeagues(){
 $("leagues").innerHTML=data[state.sport].map(x=>`<button class="league ${state.league==x[0]?"active":"bg-slate-900"} rounded-2xl border border-slate-700 px-4 py-2 font-black text-sm" data-l="${x[0]}">${x[1]}</button>`).join("");
 document.querySelectorAll(".league").forEach(b=>b.onclick=()=>{
  state.league=b.dataset.l;
  renderLeagues(); loadGames();
  $("box").innerHTML="請先選一場賽事，點「開始分析」。";
 });
}

async function loadGames(){
 $("games").innerHTML='<div class="rounded-2xl bg-slate-950 border border-slate-800 p-5 text-slate-400">讀取今日賽事中...</div>';
 try{
  const r=await fetch(`/api/games?league=${state.league}&t=${Date.now()}`);
  const d=await r.json();
  state.games=d.games||[];
  $("title").textContent=`${d.leagueName||state.league}｜今日賽事`;
  $("last").textContent=`更新：${new Date(d.updatedAt||Date.now()).toLocaleTimeString("zh-TW")}`;
  renderGames();
 }catch(e){
  $("games").innerHTML=`<div class="rounded-2xl bg-red-500/10 border border-red-500/30 p-5 text-red-200">讀取失敗：${esc(e.message)}</div>`;
 }
}

function renderGames(){
 if(!state.games.length){
  $("games").innerHTML='<div class="rounded-2xl bg-slate-950 border border-slate-800 p-5 text-slate-400">目前沒有賽事。</div>';
  return;
 }
 $("games").innerHTML=state.games.map((g,i)=>`
  <article class="rounded-3xl bg-slate-950/80 border border-slate-800 p-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div>
        <div class="text-xs text-slate-500 font-bold">${esc(g.time)}</div>
        <h3 class="text-xl font-black mt-1">${esc(g.matchup)}</h3>
        <div class="flex flex-wrap gap-2 mt-3 text-xs">
          <span class="rounded-lg bg-blue-400/10 border border-blue-400/20 text-blue-300 px-2 py-1">讓分：${esc(g.handicapLine)}</span>
          <span class="rounded-lg bg-pink-400/10 border border-pink-400/20 text-pink-300 px-2 py-1">大小：${esc(g.totalLine)}</span>
        </div>
      </div>
      <button onclick="analyzeGame(${i})" class="rounded-2xl bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 font-black px-5 py-3">開始分析</button>
    </div>
  </article>
 `).join("");
}

window.analyzeGame=async i=>{
 const g=state.games[i];
 $("box").innerHTML=`<div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
  <div class="font-black text-slate-100 mb-3">${esc(g.matchup)}</div>
  <div class="space-y-2 text-emerald-300 font-bold">
    <div class="scan">正在讀取即時盤口指標...</div>
    <div class="scan">正在比對雙方近況與歷年戰績...</div>
    <div class="scan">正在評估讓分過盤與大小分...</div>
    <div class="scan">正在產生 AI 推薦...</div>
  </div>
 </div>`;

 try{
  const q=new URLSearchParams({
   league:state.league,
   gameId:g.id,
   away:g.awayTeam||"",
   home:g.homeTeam||"",
   handicap:g.handicapLine||"",
   total:g.totalLine||""
  });
  const r=await fetch(`/api/analyze?${q.toString()}&t=${Date.now()}`);
  const d=await r.json();
  const a=d.analysis||{};
  const game=d.game||g;
  $("box").innerHTML=`<div class="space-y-4">
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="text-xs text-slate-500 font-black">${esc(d.leagueName||state.league)}</div>
      <h4 class="text-xl font-black mt-1">${esc(game.matchup)}</h4>
      <div class="text-xs text-slate-500 mt-1">分析時間：${new Date(d.updatedAt||Date.now()).toLocaleTimeString("zh-TW")}</div>
    </div>
    <div class="rounded-2xl bg-emerald-400/10 border border-emerald-400/20 p-4">
      <div class="text-xs text-emerald-300 font-black">核心推薦</div>
      <div class="text-2xl font-black text-emerald-300 mt-1">${esc(a.pickTeam)}</div>
      ${bar(a.confidence)}
      <div class="text-xs text-slate-400 mt-1">整體信心 ${a.confidence||0}%</div>
    </div>
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="text-xs text-slate-500 font-black">預測比分</div>
      <div class="font-black text-amber-300 mt-1">${esc(a.predictedScore)}</div>
    </div>
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="text-xs text-slate-500 font-black">獨贏方向</div>
      <div class="font-black text-amber-300 mt-1">${esc(a.pickTeam)}</div>
      ${bar(a.winRate)}
      <div class="text-xs text-slate-400 mt-1">獨贏率 ${a.winRate||0}%</div>
    </div>
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="text-xs text-slate-500 font-black">讓分判斷</div>
      <div class="font-black text-blue-300 mt-1">${esc(a.spreadPick)}</div>
      ${bar(a.coverRate)}
      <div class="text-xs text-slate-400 mt-1">過盤率 ${a.coverRate||0}%</div>
    </div>
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="text-xs text-slate-500 font-black">大小分判斷</div>
      <div class="font-black text-pink-300 mt-1">${esc(a.totalPick)}</div>
      ${bar(a.totalRate)}
      <div class="text-xs text-slate-400 mt-1">大 ${a.overRate||0}% / 小 ${a.underRate||0}%</div>
    </div>
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="text-xs text-slate-500 font-black mb-2">AI 總結</div>
      <ul class="list-disc pl-5 space-y-2 text-slate-300">${(a.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
    </div>
  </div>`;
 }catch(e){
  $("box").innerHTML=`<div class="rounded-2xl bg-red-500/10 border border-red-500/30 p-4 text-red-200">分析失敗：${esc(e.message)}</div>`;
 }
};

$("reload").onclick=loadGames;
renderSports();
renderLeagues();
loadGames();
</script>
</body>
</html>
