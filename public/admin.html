<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>龍女體育管理後台</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#060914;color:#e5e7eb}.glass{background:rgba(15,23,42,.84);border:1px solid rgba(148,163,184,.16)}</style></head>
<body><main class="max-w-5xl mx-auto p-4 space-y-4"><h1 class="text-2xl font-black text-amber-300">龍女體育管理後台</h1>
<section class="glass rounded-3xl p-4"><h2 class="font-black mb-3">管理員登入</h2><input id="email" class="rounded-xl bg-slate-950 border border-slate-700 p-3 mr-2" placeholder="Email"><input id="password" type="password" class="rounded-xl bg-slate-950 border border-slate-700 p-3 mr-2" placeholder="密碼"><button onclick="login()" class="rounded-xl bg-amber-400 text-slate-950 font-black px-4 py-3">登入</button><div id="status" class="mt-2 text-sm text-slate-400"></div></section>
<section class="glass rounded-3xl p-4"><h2 class="font-black mb-3">建立會員帳號</h2><div class="grid md:grid-cols-4 gap-2"><input id="uemail" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="會員 Email"><input id="upass" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="初始密碼"><input id="unick" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="暱稱"><select id="urole" class="rounded-xl bg-slate-950 border border-slate-700 p-3"><option value="member">member</option><option value="admin">admin</option></select></div><button onclick="createUser()" class="mt-2 rounded-xl bg-emerald-400 text-slate-950 font-black px-4 py-3">建立帳號</button></section>
<section class="glass rounded-3xl p-4"><h2 class="font-black mb-3">新增平台推薦人</h2><div class="grid md:grid-cols-5 gap-2"><input id="pnick" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="推薦人名稱"><input id="pavatar" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="圖示"><input id="pbio" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="介紹"><input id="p30" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="近30場%"><input id="pall" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="總準度%"></div><button onclick="createPundit()" class="mt-2 rounded-xl bg-blue-400 text-slate-950 font-black px-4 py-3">新增推薦人</button></section>
<section class="glass rounded-3xl p-4"><h2 class="font-black mb-3">新增推薦人賽事建議</h2><div class="grid md:grid-cols-2 gap-2"><input id="pid" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="推薦人 ID"><input id="gkey" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="game_key，例如 MLB|洋基|皇家|AM 07:40"><input id="market" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="市場：讓分/大小/獨贏"><input id="pick" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="推薦"><input id="line" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="盤口"><input id="reason" class="rounded-xl bg-slate-950 border border-slate-700 p-3" placeholder="理由"></div><button onclick="createPick()" class="mt-2 rounded-xl bg-pink-400 text-slate-950 font-black px-4 py-3">新增建議</button><div class="mt-4"><button onclick="listPundits()" class="rounded-xl bg-slate-800 px-4 py-2 font-black">查看推薦人 ID</button><pre id="out" class="mt-2 whitespace-pre-wrap text-xs bg-slate-950 p-3 rounded-xl"></pre></div></section>
</main><script>
let session=JSON.parse(localStorage.getItem('admin_session')||'null');function token(){return session?.access_token||''}function h(){return {'content-type':'application/json','authorization':'Bearer '+token()}}
async function login(){const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',email:email.value,password:password.value})});const d=await r.json();if(!d.ok)return alert(d.error);session=d.session;localStorage.setItem('admin_session',JSON.stringify(session));status.textContent='已登入：'+(d.profile?.nickname||d.user.email)}
async function admin(body){const r=await fetch('/api/admin',{method:'POST',headers:h(),body:JSON.stringify(body)});const d=await r.json();out.textContent=JSON.stringify(d,null,2);if(!d.ok)alert(d.error||'失敗');return d}
function createUser(){admin({action:'create_user',email:uemail.value,password:upass.value,nickname:unick.value,role:urole.value})}
function createPundit(){admin({action:'create_pundit',nickname:pnick.value,avatar:pavatar.value,bio:pbio.value,accuracy_30:p30.value,accuracy_all:pall.value})}
function createPick(){admin({action:'create_pundit_pick',pundit_id:pid.value,game_key:gkey.value,market:market.value,pick:pick.value,line:line.value,reason:reason.value})}
function listPundits(){admin({action:'list_pundits'})}
</script></body></html>
