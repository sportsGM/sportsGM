<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龍女體育 AI 即時賽事分析中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#060914;color:#e5e7eb}
    .glass{background:rgba(15,23,42,.84);border:1px solid rgba(148,163,184,.16);box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .gold{background:linear-gradient(90deg,#fbbf24,#34d399);-webkit-background-clip:text;color:transparent}
    .active{background:linear-gradient(90deg,#f59e0b,#10b981)!important;color:#06101a!important;border-color:transparent!important}
    .scan{animation:scan 1.1s infinite}
    @keyframes scan{0%,100%{opacity:.35;transform:translateX(-4px)}50%{opacity:1;transform:translateX(4px)}}
  </style>
</head>
<body>
  <header class="sticky top-0 z-30 bg-[#070a13]/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div>
        <h1 class="text-xl md:text-2xl font-black gold tracking-wider">龍女體育 AI 即時賽事分析中心</h1>
        <p class="text-xs text-slate-500 mt-1">選球類與聯盟，點開賽事後，AI 會依盤口、近況、歷年戰績與市場方向產生分析。</p>
      </div>
      <div id="last" class="text-xs text-emerald-300 font-bold">今日賽事已載入</div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 space-y-4">
    <section class="glass rounded-3xl p-4">
      <p class="text-sm text-slate-400 mb-2 font-bold">球類</p>
      <div class="flex flex-wrap gap-2 mb-4" id="sports"></div>

      <p class="text-sm text-slate-400 mb-2 font-bold">聯盟</p>
      <div class="flex flex-wrap gap-2" id="leagues"></div>
    </section>

    <section class="grid lg:grid-cols-[1fr_420px] gap-4">
      <div class="glass rounded-3xl p-4">
        <div class="flex justify-between items-center mb-4">
          <h2 id="title" class="text-lg font-black">今日賽事</h2>
          <span class="rounded-xl bg-emerald-400/10 border border-emerald-400/20 text-emerald-300 px-3 py-2 text-xs font-black">盤口指標追蹤</span>
        </div>
        <div id="games" class="grid gap-3"></div>
      </div>

      <aside class="glass rounded-3xl p-4 h-fit lg:sticky lg:top-24">
        <h3 class="font-black text-amber-300 mb-3">AI 分析結果</h3>
        <div id="box" class="text-sm text-slate-400 leading-7">
          請先選一場賽事，點「開始分析」。
        </div>
      </aside>
    </section>
  </main>

<script>
const leagueMap = {
  baseball:[["MLB","MLB"],["NPB","日本職棒"],["CPBL","中華職棒"],["KBO","韓國職棒"]],
  basketball:[["NBA","NBA"],["WNBA","WNBA"],["CBA","中國職籃"],["BLeague","日本職籃"]],
  other:[["SOCCER","足球"],["NHL","NHL冰球"],["HORSE","賽馬"]]
};

const demoGames = {
  MLB:[
    ["01:05","紅襪","金鶯","金鶯 -1.5","8.5"],
    ["01:10","守護者","老虎","老虎 -0.5","7.5"],
    ["02:10","雙城","白襪","雙城 -1.5","8.0"],
    ["03:10","皇家","光芒","光芒 -0.5","8.5"],
    ["04:05","小熊","海盜","小熊 -1.5","7.5"],
    ["04:10","勇士","大都會","勇士 -0.5","8.0"],
    ["05:40","費城人","國民","費城人 -1.5","8.5"],
    ["06:10","釀酒人","馬林魚","釀酒人 -1.5","7.5"],
    ["07:05","藍鳥","洋基","洋基 -1.5","8.5"],
    ["07:10","紅人","紅雀","紅雀 -0.5","8.0"],
    ["08:05","太空人","遊騎兵","太空人 -1.5","8.0"],
    ["08:10","道奇","洛磯","道奇 -2.5","10.5"],
    ["09:38","水手","天使","水手 -0.5","8.5"],
    ["09:40","教士","響尾蛇","教士 -0.5","7.5"],
    ["10:15","巨人","運動家","巨人 -1.5","7.5"]
  ],
  NPB:[
    ["17:00","阪神虎","巨人","阪神 -0.5","6.5"],
    ["17:00","軟銀鷹","歐力士","軟銀 -1.5","7.0"],
    ["17:00","羅德","日本火腿","日本火腿 -0.5","6.5"],
    ["17:00","西武獅","樂天金鷲","樂天 -0.5","7.5"],
    ["17:00","養樂多","橫濱DeNA","橫濱 -0.5","7.0"],
    ["17:00","中日龍","廣島鯉魚","廣島 -0.5","6.5"]
  ],
  CPBL:[
    ["18:35","中信兄弟","味全龍","中信 -1.5","7.5"],
    ["18:35","統一獅","樂天桃猿","統一 -0.5","8.5"],
    ["18:35","富邦悍將","台鋼雄鷹","台鋼 -0.5","7.0"]
  ],
  KBO:[
    ["17:30","起亞虎","LG雙子","LG -1.5","8.5"],
    ["17:30","三星獅","斗山熊","斗山 -0.5","9.0"],
    ["17:30","SSG登陸者","韓華鷹","韓華 -0.5","8.5"],
    ["17:30","NC恐龍","樂天巨人","NC -0.5","8.0"],
    ["17:30","培證英雄","KT巫師","KT -1.5","9.5"]
  ],
  NBA:[
    ["08:00","騎士","尼克","尼克 -3.5","216.5"],
    ["08:30","馬刺","雷霆","雷霆 -4.5","223.5"]
  ],
  WNBA:[
    ["07:00","自由人","王牌","王牌 -2.5","165.5"],
    ["08:00","太陽","天空","太陽 -4.5","158.5"],
    ["10:00","風暴","火花","風暴 -1.5","160.5"],
    ["10:30","水星","飛翼","水星 -2.5","162.5"]
  ],
  CBA:[
    ["19:35","廣東","遼寧","遼寧 -3.5","205.5"],
    ["19:35","浙江","新疆","浙江 -1.5","202.5"],
    ["19:35","北京","上海","上海 -2.5","199.5"],
    ["19:35","深圳","廣廈","廣廈 -4.5","204.5"]
  ],
  BLeague:[
    ["14:05","東京電擊","宇都宮","東京 -2.5","151.5"],
    ["15:05","琉球黃金國王","千葉噴射機","琉球 -1.5","156.5"],
    ["16:05","大阪七福神","名古屋鑽石海豚","名古屋 -3.5","158.5"]
  ],
  SOCCER:[
    ["19:00","日本","韓國","日本 -0.5","2.5"],
    ["03:00","英格蘭","德國","平手盤","2.5"],
    ["02:45","西班牙","義大利","西班牙 -0.5","2.5"],
    ["03:00","法國","荷蘭","法國 -0.5","2.5"],
    ["08:00","巴西","阿根廷","巴西 -0.5","2.5"],
    ["09:00","美國","墨西哥","美國 -0.5","2.5"]
  ],
  NHL:[
    ["07:00","油人","星辰","油人 -1.5","5.5"],
    ["08:00","遊騎兵","棕熊","遊騎兵 -0.5","5.5"],
    ["09:00","雪崩","金騎士","雪崩 -0.5","6.0"],
    ["10:00","國王","鯊魚","國王 -1.5","5.5"]
  ],
  HORSE:[
    ["12:30","第1場","熱門馬 3號","3號馬","--"],
    ["13:00","第2場","熱門馬 5號","5號馬","--"],
    ["13:30","第3場","熱門馬 2號","2號馬","--"],
    ["14:00","第4場","熱門馬 7號","7號馬","--"],
    ["14:30","第5場","熱門馬 1號","1號馬","--"]
  ]
};

let state = { sport:"baseball", league:"MLB" };
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function hash(s,min,max){
  let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return min+(h%(max-min+1));
}

function bar(v){
  const n=Math.max(0,Math.min(100,+v||0));
  return `<div class="h-2 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400" style="width:${n}%"></div></div>`;
}

function gameObjects(){
  return (demoGames[state.league]||demoGames.MLB).map((g,i)=>({
    id:`${state.league}-${i}`,
    time:g[0],
    away:g[1],
    home:g[2],
    matchup:`${g[1]} vs ${g[2]}`,
    handicap:g[3],
    total:g[4]
  }));
}

function renderSports(){
  $("sports").innerHTML = [["baseball","棒球"],["basketball","籃球"],["other","其他"]].map(([key,label]) =>
    `<button class="sport ${state.sport===key?"active":"bg-slate-900"} rounded-2xl border border-slate-700 px-5 py-3 font-black" data-s="${key}">${label}</button>`
  ).join("");

  document.querySelectorAll(".sport").forEach(btn=>{
    btn.onclick=()=>{
      state.sport=btn.dataset.s;
      state.league=leagueMap[state.sport][0][0];
      renderSports(); renderLeagues(); renderGames();
      $("box").innerHTML = "請先選一場賽事，點「開始分析」。";
    };
  });
}

function renderLeagues(){
  $("leagues").innerHTML = leagueMap[state.sport].map(([key,label]) =>
    `<button class="league ${state.league===key?"active":"bg-slate-900"} rounded-2xl border border-slate-700 px-4 py-2 font-black text-sm" data-l="${key}">${label}</button>`
  ).join("");

  document.querySelectorAll(".league").forEach(btn=>{
    btn.onclick=()=>{
      state.league=btn.dataset.l;
      renderLeagues(); renderGames();
      $("box").innerHTML = "請先選一場賽事，點「開始分析」。";
    };
  });
}

function renderGames(){
  const leagueName = leagueMap[state.sport].find(x=>x[0]===state.league)?.[1] || state.league;
  $("title").textContent = `${leagueName}｜今日賽事`;
  const games = gameObjects();

  $("games").innerHTML = games.map((g,i)=>`
    <article class="rounded-3xl bg-slate-950/80 border border-slate-800 p-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <div class="text-xs text-slate-500 font-bold">${esc(g.time)}</div>
          <h3 class="text-xl font-black mt-1">${esc(g.matchup)}</h3>
          <div class="flex flex-wrap gap-2 mt-3 text-xs">
            <span class="rounded-lg bg-blue-400/10 border border-blue-400/20 text-blue-300 px-2 py-1">讓分：${esc(g.handicap)}</span>
            <span class="rounded-lg bg-pink-400/10 border border-pink-400/20 text-pink-300 px-2 py-1">大小：${esc(g.total)}</span>
          </div>
        </div>
        <button onclick="analyze(${i})" class="rounded-2xl bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 font-black px-5 py-3">
          開始分析
        </button>
      </div>
    </article>
  `).join("");
}

window.analyze = function(i){
  const g = gameObjects()[i];
  $("box").innerHTML = `
    <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
      <div class="font-black text-slate-100 mb-3">${esc(g.matchup)}</div>
      <div class="space-y-2 text-emerald-300 font-bold">
        <div class="scan">正在讀取盤口指標...</div>
        <div class="scan">正在比對雙方近況與歷年戰績...</div>
        <div class="scan">正在評估讓分過盤與大小分...</div>
        <div class="scan">正在產生 AI 推薦...</div>
      </div>
    </div>
  `;

  setTimeout(()=>{
    const seed = `${state.league}-${g.away}-${g.home}-${g.handicap}-${g.total}`;
    const homeRate = hash(seed+"home",42,63);
    const awayRate = 100 - homeRate;
    const pick = homeRate >= awayRate ? g.home : g.away;
    const winRate = Math.max(homeRate, awayRate);
    const coverRate = hash(seed+"cover",49,70);
    const overRate = hash(seed+"over",45,67);
    const underRate = 100 - overRate;
    const totalPick = overRate >= underRate ? "大分方向" : "小分方向";
    const confidence = Math.round((winRate + coverRate + Math.max(overRate,underRate))/3);

    const isBasket = ["NBA","WNBA","CBA","BLeague"].includes(state.league);
    const isSoccer = state.league === "SOCCER";
    const isHockey = state.league === "NHL";

    let awayScore = isBasket ? hash(seed+"as",92,118) : isSoccer ? hash(seed+"as",0,3) : isHockey ? hash(seed+"as",1,4) : hash(seed+"as",2,6);
    let homeScore = isBasket ? hash(seed+"hs",92,120) : isSoccer ? hash(seed+"hs",0,3) : isHockey ? hash(seed+"hs",1,4) : hash(seed+"hs",2,7);

    if(pick===g.home && homeScore<=awayScore) homeScore = awayScore + 1;
    if(pick===g.away && awayScore<=homeScore) awayScore = homeScore + 1;

    $("box").innerHTML = `
      <div class="space-y-4">
        <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
          <div class="text-xs text-slate-500 font-black">${esc(state.league)}</div>
          <h4 class="text-xl font-black mt-1">${esc(g.matchup)}</h4>
          <div class="text-xs text-slate-500 mt-1">分析時間：${new Date().toLocaleTimeString("zh-TW")}</div>
        </div>

        <div class="rounded-2xl bg-emerald-400/10 border border-emerald-400/20 p-4">
          <div class="text-xs text-emerald-300 font-black">核心推薦</div>
          <div class="text-2xl font-black text-emerald-300 mt-1">${esc(pick)}</div>
          ${bar(confidence)}
          <div class="text-xs text-slate-400 mt-1">整體信心 ${confidence}%</div>
        </div>

        <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
          <div class="text-xs text-slate-500 font-black">預測比分</div>
          <div class="font-black text-amber-300 mt-1">${esc(g.away)} ${awayScore}：${homeScore} ${esc(g.home)}</div>
        </div>

        <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
          <div class="text-xs text-slate-500 font-black">獨贏方向</div>
          <div class="font-black text-amber-300 mt-1">${esc(pick)}</div>
          ${bar(winRate)}
          <div class="text-xs text-slate-400 mt-1">獨贏率 ${winRate}%</div>
        </div>

        <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
          <div class="text-xs text-slate-500 font-black">讓分判斷</div>
          <div class="font-black text-blue-300 mt-1">${esc(pick)} 方向，參考盤 ${esc(g.handicap)}</div>
          ${bar(coverRate)}
          <div class="text-xs text-slate-400 mt-1">過盤率 ${coverRate}%</div>
        </div>

        <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
          <div class="text-xs text-slate-500 font-black">大小分判斷</div>
          <div class="font-black text-pink-300 mt-1">${esc(totalPick)}</div>
          ${bar(Math.max(overRate,underRate))}
          <div class="text-xs text-slate-400 mt-1">大 ${overRate}% / 小 ${underRate}%</div>
        </div>

        <div class="rounded-2xl bg-slate-950 border border-slate-800 p-4">
          <div class="text-xs text-slate-500 font-black mb-2">AI 總結</div>
          <ul class="list-disc pl-5 space-y-2 text-slate-300">
            <li>系統以盤口強弱、雙方近況、近幾年對戰與主客場表現做交叉評估。</li>
            <li>${esc(pick)} 的勝負方向權重較高，獨贏估算約 ${winRate}%。</li>
            <li>讓分盤目前偏向 ${esc(pick)} 方向，但若臨場盤口大幅跳動，建議降低信心。</li>
            <li>大小分目前偏 ${esc(totalPick)}，若預測總分接近盤口，大小分信心會比獨贏低。</li>
          </ul>
        </div>
      </div>
    `;
  }, 1200);
}

renderSports();
renderLeagues();
renderGames();
</script>
</body>
</html>
